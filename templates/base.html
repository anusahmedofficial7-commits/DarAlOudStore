{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>

{% block title %}
Dar Al Oud
{% endblock %}

</title>



<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<style>


:root {

    --coffee: #2B1B14;
    --gold: #C9A227;
    --beige: #F5E6C8;
    --white: #FFFFFF;

}



body {

    background: #faf7f2;

    font-family: 'Segoe UI', sans-serif;

}




/* NAVBAR */


.luxury-navbar {

    background: var(--coffee);

}



.brand-name {

    color: var(--gold) !important;

    font-size: 28px;

    font-weight: 700;

}



.nav-link {

    color: white !important;

    margin-left: 15px;

}



.nav-link:hover {

    color: var(--gold) !important;

}

/* ================= LOGO ================= */


.logo-img {

    width: 55px;

    height: 55px;

    object-fit: cover;

    border-radius: 50%;

}



/* ================= BUTTON ================= */


.btn-warning {

    background-color: var(--gold) !important;

    border-color: var(--gold) !important;

    color: var(--coffee) !important;

    font-weight: 700;

}



.btn-warning:hover {

    background-color: var(--beige) !important;

    border-color: var(--beige) !important;

}



/* ================= CARD ================= */


.card {

    border-radius: 15px;

}



.card:hover {

    transform: translateY(-5px);

    transition: 0.3s;

}



/* ================= WHATSAPP BUTTON ================= */


.whatsapp-btn {

    position: fixed;

    bottom: 25px;

    right: 25px;

    background: #25D366;

    color: white;

    padding: 14px 22px;

    border-radius: 50px;

    text-decoration: none;

    font-weight: bold;

    z-index: 999;

    box-shadow: 0 5px 15px rgba(0,0,0,0.3);

}



.whatsapp-btn:hover {

    background: #128C7E;

    color: white;

}


</style>
</head>


<body>



<!-- ================= NAVBAR ================= -->


<nav class="navbar navbar-expand-lg luxury-navbar">


<div class="container">



<a class="navbar-brand d-flex align-items-center"
href="{% url 'home' %}">


<img src="{% static 'images/logo.png' %}"
class="logo-img me-2"
alt="Dar Al Oud Logo">



<span class="brand-name">

Dar Al Oud

</span>


</a>




<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarMenu">


<span class="navbar-toggler-icon"></span>


</button>
<div class="collapse navbar-collapse"
id="navbarMenu">


<ul class="navbar-nav ms-auto">



<li class="nav-item">

<a class="nav-link"
href="{% url 'home' %}">

Home

</a>

</li>



<li class="nav-item">

<a class="nav-link"
href="{% url 'cart' %}">

Cart

</a>

</li>



<li class="nav-item">

<a class="nav-link"
href="{% url 'wishlist' %}">

Wishlist

</a>

</li>



<li class="nav-item">

<a class="nav-link"
href="{% url 'checkout' %}">

Checkout

</a>

</li>



<li class="nav-item">

<a class="nav-link"
href="{% url 'track_order' %}">

Track Order

</a>

</li>



</ul>


</div>


</div>


</nav>





<!-- ================= PAGE CONTENT ================= -->


<main>


{% block content %}


{% endblock %}


</main>
<!-- ================= WHATSAPP BUTTON ================= -->

<a href="https://wa.me/923132527157?text=Assalamualaikum%20mujhe%20perfume%20order%20karna%20hai"
   target="_blank"
   class="whatsapp-btn">

    💬 WhatsApp Order

</a>
<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
